name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies and reviewed Git preparation
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check local documentation links
        run: bun run check:links

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium

      - name: Test Node runtime
        run: bun run test:node

      - name: Test browser runtime and optional Docker sessions
        run: bun run test:e2e

      - name: Test Vitest integrations
        run: bun run test:vitest

      - name: Verify npm package exports and contents
        run: bun run check:package
