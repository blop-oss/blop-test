name: Feature request
description: Propose a scoped improvement to the Blop testing library.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        This library owns the testing DSL, bounded agent executor, evidence,
        reporters, configuration, and optional coverage/upload. Browser tools
        belong in blop-browser; monitoring, skills, and CLI routing in blop-app.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe a concrete testing problem and who encounters it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest public behavior or API change that solves it.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Test DSL or configuration
        - Agent execution or evidence
        - Reporter or OpenTelemetry
        - Coverage
        - Hosted upload boundary
        - Package or integration API
        - Documentation or developer tooling
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Compatibility, safety, and privacy
      description: Explain API changes, execution capability, provider costs, side effects, and data-flow impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Include sanitized reproductions or verification plans, not unsupported success/performance claims.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This request belongs in the testing library rather than browser tools or monitoring.
          required: true
